<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selection Colors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="section" id="section">
    <header class="head">
      <button class="title" id="toggle" type="button" aria-expanded="true">
        <svg class="chev" viewBox="0 0 8 8" width="8" height="8" aria-hidden="true"><path d="M1.5 2.5 4 5l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Selection colors</span>
      </button>
      <div class="tools">
        <button class="tool" id="deep" type="button" title="Include colours inside precomps (changes affect every use of that precomp)" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2.5" y="2.5" width="8" height="8" rx="1" fill="none" stroke="currentColor"/><rect x="5.5" y="5.5" width="8" height="8" rx="1" fill="none" stroke="currentColor"/></svg>
        </button>
        <button class="tool" id="refresh" type="button" title="Rescan selection">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-linecap="round"/><path d="M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <div class="update" id="update" hidden>
      <p class="update-text" id="updateText"></p>
      <div class="update-actions">
        <button class="update-btn" id="updateInstall" type="button">Update</button>
        <button class="update-dismiss" id="updateDismiss" type="button" title="Dismiss">&times;</button>
      </div>
    </div>
    <div class="body" id="body">
      <div class="list" id="list" role="list"></div>
      <p class="empty" id="empty">Select layers in a composition</p>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="picker.js"></script>
  <script src="main.js"></script>
</body>
</html>
